      - "Questions"
      summary: "Create a new question"
      operationId: "questions_post"
      parameters:
      - name: "body"
        in: "query"
        description: "Question object that needs to be created"
        required: true
        type: "string"
      - name: "title"
        in: "query"
        description: "Question object that needs to be created"
        required: true
        type: "string"
      - name: "tags"
        in: "query"
        description: "Question object that needs to be created"
        required: true
        type: "string"
      responses:
        "201":
          description: "Created"
          headers:
            Location:
              type: "string"
              description: "URL of the created resource"
      x-swagger-router-controller: "swagger_server.controllers.questions_controller"
  /questions/{questionId}:
    get:
      tags:
      - "Questions"
      summary: "Get details of a specific question by ID"
      operationId: "questions_question_id_get"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "get details of questions"
      x-swagger-router-controller: "swagger_server.controllers.questions_controller"
  /users/{userid}/questions/{questionId}:
    delete:
      tags:
      - "Questions"
      summary: "Delete a question by ID"
      operationId: "users_userid_questions_question_id_delete"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get details for"
        required: true
        type: "integer"
      - name: "userid"
        in: "path"
        description: "ID of userid"
        required: true
        type: "integer"
      responses:
        "204":
          description: "No Content"
