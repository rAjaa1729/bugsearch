      tags:
      - "Questions"
      summary: "Get a list of all questions"
      operationId: "questions_get"
      parameters:
      - name: "sortByUpvotes"
        in: "query"
        description: "Sort the questions by upvotes"
        required: false
        type: "boolean"
        default: true
      - name: "sortByCreationDate"
        in: "query"
        description: "Sort the questions by upvotes"
        required: false
        type: "boolean"
        default: false
      responses:
        "200":
          description: "OK"
      x-swagger-router-controller: "swagger_server.controllers.questions_controller"
    post:
