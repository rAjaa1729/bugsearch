  /questions/{questionId}/answers:
    get:
      tags:
      - "Answers"
      summary: "Get a list of all answers to a specific question by ID"
      operationId: "questions_question_id_answers_get"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get answers for"
        required: true
        type: "integer"
      - name: "sortByUpvotes"
        in: "query"
        description: "Sort the questions by upvotes"
        required: false
        type: "boolean"
        default: true
      - name: "sortByCreationDate"
        in: "query"
        description: "Sort the questions by upvotes"
        required: false
        type: "boolean"
        default: false
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/Answer"
      x-swagger-router-controller: "swagger_server.controllers.answers_controller"
  /users/{userid}/questions/{questionId}/answers:
    post:
      tags:
      - "Answers"
      summary: "Post a new answer to a specific question"
      operationId: "users_userid_questions_question_id_answers_post"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get answers for"
        required: true
        type: "integer"
      - name: "userid"
        in: "path"
        description: "ID of userid"
        required: true
        type: "integer"
      - name: "body"
        in: "query"
        description: "Question object that needs to be created"
        required: false
        type: "string"
      responses:
        "201":
          description: "Answer created successfully"
          schema:
            $ref: "#/definitions/Answer"
      x-swagger-router-controller: "swagger_server.controllers.answers_controller"
  /questions/{questionId}/answers/{answerId}:
    get:
      tags:
      - "Answers"
      summary: "Get details of a specific answer to a specific question by ID"
      operationId: "questions_question_id_answers_answer_id_get"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get answer for"
        required: true
        type: "integer"
      - name: "answerId"
        in: "path"
        description: "ID of answer to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "Answer found"
          schema:
            $ref: "#/definitions/Answer"
      x-swagger-router-controller: "swagger_server.controllers.answers_controller"
  /user/{userid}/questions/{questionId}/answers/{answerId}:
    delete:
      tags:
      - "Answers"
      summary: "Delete an answer to a specific question by ID"
      operationId: "user_userid_questions_question_id_answers_answer_id_delete"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get answer for"
        required: true
        type: "integer"
      - name: "answerId"
        in: "path"
        description: "ID of answer to get details for"
        required: true
        type: "integer"
      - name: "userid"
        in: "path"
        description: "ID of userid"
        required: true
        type: "integer"
      responses:
        "204":
          description: "Answer deleted successfully"
      x-swagger-router-controller: "swagger_server.controllers.answers_controller"
  /user/{userid}/questions/{questionId}/comments:
    post:
      tags:
      - "Comments"
      summary: "Post a new comment on a question"
      operationId: "user_userid_questions_question_id_comments_post"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of the question to comment on"
        required: true
        type: "integer"
      - name: "userid"
        in: "path"
        description: "ID of the user"
        required: true
        type: "integer"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/Comment"
      x-swagger-router-controller: "swagger_server.controllers.comments_controller"
  /questions/{questionId}/comments/{commentId}:
    get:
      tags:
      - "Comments"
      summary: "Get a comment by comment ID"
      operationId: "questions_question_id_comments_comment_id_get"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of the question to which the comment belongs"
        required: true
        type: "integer"
      - name: "commentId"
        in: "path"
        description: "ID of the comment to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/Comment"
      x-swagger-router-controller: "swagger_server.controllers.comments_controller"
  /user/{userid}/questions/{questionId}/comments/{commentId}:
    delete:
      tags:
      - "Comments"
      summary: "Delete a comment by comment ID"
      operationId: "user_userid_questions_question_id_comments_comment_id_delete"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of the question to comment on"
        required: true
        type: "integer"
      - name: "userid"
        in: "path"
        description: "ID of the user"
        required: true
        type: "integer"
      - name: "commentId"
        in: "path"
        description: "ID of the user"
        required: true
        type: "integer"
      responses:
        "200":
          description: "OK"
      x-swagger-router-controller: "swagger_server.controllers.comments_controller"
  /questions/{questionId}/answers/{answerId}/comments:
    get:
      tags:
      - "Comments"
      summary: "Get all comments on an answer"
      operationId: "questions_question_id_answers_answer_id_comments_get"
      produces:
      - "application/json"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get answer for"
        required: true
        type: "integer"
      - name: "answerId"
        in: "path"
        description: "ID of answer to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/Comment"
      x-swagger-router-controller: "swagger_server.controllers.comments_controller"
  /questions/{questionId}/answers/{answerId}/comments/{commentId}:
    get:
      tags:
      - "Comments"
      summary: "Get a particular comment on an answer"
      operationId: "questions_question_id_answers_answer_id_comments_comment_id_get"
      produces:
      - "application/json"
      parameters:
      - name: "questionId"
        in: "path"
        description: "ID of question to get answer for"
        required: true
        type: "integer"
      - name: "answerId"
        in: "path"
        description: "ID of answer to get details for"
        required: true
        type: "integer"
      - name: "commentId"
        in: "path"
        description: "ID of the comment to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "OK"
          schema:
            $ref: "#/definitions/Comment"
      x-swagger-router-controller: "swagger_server.controllers.comments_controller"
  /user/{userid}//questions/{questionId}/answers/{answerId}/comments/{commentId}:
    delete:
      tags:
      - "Comments"
      summary: "Delete a comment by comment ID"
      operationId: "user_userid_questions_question_id_answers_answer_id_comments_comment_id_delete"
      parameters:
      - name: "userid"
        in: "path"
        description: "ID of question to get answer for"
        required: true
        type: "integer"
      - name: "questionId"
        in: "path"
        description: "ID of question to get answer for"
        required: true
        type: "integer"
      - name: "answerId"
        in: "path"
        description: "ID of answer to get details for"
        required: true
        type: "integer"
      - name: "commentId"
        in: "path"
        description: "ID of the comment to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "OK"
      x-swagger-router-controller: "swagger_server.controllers.comments_controller"
  /search/questions:
    get:
      tags:
      - "Search"
      summary: "Search for questions by keyword"
      operationId: "search_questions_get"
      parameters:
      - name: "keyword"
        in: "query"
        description: "Keyword to search for"
        required: true
        type: "string"
      - name: "sortByUovote"
        in: "query"
        description: "Sort the questions by upvotes"
        required: false
        type: "boolean"
        default: false
      responses:
        "200":
          description: "Successful operation"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Question"
        "400":
          description: "Invalid input"
      x-swagger-router-controller: "swagger_server.controllers.search_controller"
  /search/tags:
    get:
      tags:
      - "Search"
      summary: "Search for tags by keyword"
      operationId: "search_tags_get"
      parameters:
      - name: "keyword"
        in: "query"
        description: "Keyword to search for"
        required: true
        type: "string"
      responses:
        "200":
          description: "Successful operation"
          schema:
            type: "array"
