        required: true
        type: "integer"
      - name: "questionId"
        in: "path"
        description: "ID of question to get details for"
        required: true
        type: "integer"
      - name: "answerId"
        in: "path"
        description: "ID of question to get details for"
        required: true
        type: "integer"
      - name: "userid"
        in: "path"
        description: "ID of userid"
        required: true
        type: "integer"
      responses:
        "200":
          description: "Successfully voted"
      x-swagger-router-controller: "swagger_server.controllers.vote_controller"
definitions:
  User:
    type: "object"
    properties:
      id:
        type: "integer"
      username:
        type: "string"
      email:
        type: "string"
      imageurl:
        type: "string"
      about:
        type: "string"
      password:
        type: "string"
      creationdate:
        type: "string"
      reputation_points:
        type: "integer"
      follower:
        type: "integer"
      following:
        type: "integer"
      badges:
        type: "object"
        properties: {}
    example:
      badges: "{}"
      password: "password"
      creationdate: "creationdate"
      follower: 1
      imageurl: "imageurl"
      following: 5
      about: "about"
      id: 0
      reputation_points: 6
      email: "email"
      username: "username"
  Question:
    type: "object"
    properties:
      id:
        type: "integer"
      title:
        type: "string"
      body:
        type: "string"
      question_tags:
        type: "object"
        properties: {}
      user_id:
        type: "integer"
      answercount:
        type: "integer"
      commentcount:
        type: "integer"
      answeracceptedid:
        type: "integer"
      creationdate:
        type: "string"
      upvote:
        type: "integer"
      downvote:
        type: "integer"
    example:
      commentcount: 5
      creationdate: "creationdate"
      downvote: 7
      question_tags: "{}"
      answercount: 1
      user_id: 6
      answeracceptedid: 5
      id: 0
      title: "title"
      body: "body"
      upvote: 2
  Answer:
    type: "object"
    properties:
      id:
        type: "integer"
      body:
        type: "string"
      user_id:
        type: "integer"
      commentcount:
        type: "integer"
      creationdate:
        type: "string"
      upvote:
        type: "integer"
      downvote:
        type: "integer"
    example:
      commentcount: 1
      creationdate: "creationdate"
      downvote: 5
      user_id: 6
      id: 0
      body: "body"
      upvote: 5
  Comment:
    type: "object"
    properties:
      id:
        type: "integer"
      body:
        type: "string"
      user_id:
        type: "integer"
      post_type_id:
        type: "integer"
      post_id:
        type: "integer"
    example:
      post_id: 5
      user_id: 6
      post_type_id: 1
      id: 0
      body: "body"
  Tag:
    type: "object"
    properties:
      id:
        type: "integer"
      name:
        type: "string"
      description:
        type: "string"
    example:
      name: "name"
      description: "description"
      id: 0
  usertags:
    type: "object"
    properties:
      id:
        type: "integer"
      tagid:
        type: "string"
      user_id:
        type: "integer"
  questiontags:
    type: "object"
    properties:
      id:
        type: "integer"
      tagid:
        type: "string"
      qn_id:
        type: "integer"
