---
swagger: "2.0"
info:
  version: "1.0.0"
  title: "API Endpoints for Bug Search"
host: "example.com"
basePath: "/api"
schemes:
- "http"
paths:
  /users:
    get:
      tags:
      - "User"
      summary: "Get a list of all Users"
      operationId: "users_get"
      parameters:
      - name: "sortByUpvotes"
        in: "query"
        description: "Sort the questions by upvotes"
        required: false
        type: "boolean"
        default: true
      - name: "sortByCreationDate"
        in: "query"
        description: "Sort the questions by upvotes"
        required: false
        type: "boolean"
        default: false
      responses:
        "200":
          description: "OK"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
    post:
      tags:
      - "User"
      summary: "Create a new user account"
      operationId: "users_post"
      consumes:
      - "application/json"
      parameters:
      - name: "username"
        in: "query"
        description: "Username of the User"
        required: true
        type: "string"
      - name: "password"
        in: "query"
        description: "password of the User"
        required: true
        type: "string"
      - name: "email"
        in: "query"
        description: "email of the User"
        required: true
        type: "string"
      responses:
        "201":
          description: "User created successfully"
          schema:
            $ref: "#/definitions/User"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
  /usrs/forgotpassword:
    post:
      tags:
      - "User"
      summary: "in case user forgot password"
      operationId: "usrs_forgotpassword_post"
      consumes:
      - "application/json"
      parameters:
      - name: "username"
        in: "query"
        description: "Username of the User"
        required: true
        type: "string"
      - name: "email"
        in: "query"
        description: "email of the User"
        required: true
        type: "string"
      responses:
        "201":
          description: "User created successfully"
          schema:
            $ref: "#/definitions/User"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
  /users/{userid}/follower:
    get:
      tags:
      - "User"
      summary: "All the follower of the User"
      operationId: "users_userid_follower_get"
      parameters:
      - name: "userid"
        in: "path"
        description: "username of user to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              type: "string"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
  /users/{userid}/following:
    get:
      tags:
      - "User"
      summary: "All the users whom the user is following"
      operationId: "users_userid_following_get"
      parameters:
      - name: "userid"
        in: "path"
        description: "username of user to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "successful operation"
          schema:
            type: "array"
            items:
              type: "string"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
  /users/login:
    post:
      tags:
      - "User"
      summary: "Logs user into the system"
      description: ""
      operationId: "login_user"
      parameters:
      - name: "username"
        in: "query"
        description: "The user name for login"
        required: true
        type: "string"
      - name: "password"
        in: "query"
        description: "The password for login in clear text"
        required: true
        type: "string"
      responses:
        "200":
          description: "successful operation"
        "400":
          description: "Invalid username/password supplied"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
  /users/logout:
    get:
      tags:
      - "User"
      summary: "Logs out current logged in user session"
      description: ""
      operationId: "logout_user"
      parameters: []
      responses:
        default:
          description: "successful operation"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
  /users/{userid}:
    get:
      tags:
      - "User"
      summary: "Get user details by user ID"
      operationId: "users_userid_get"
      parameters:
      - name: "userid"
        in: "path"
        description: "username of user to get details for"
        required: true
        type: "integer"
      responses:
        "200":
          description: "User details"
          schema:
            $ref: "#/definitions/User"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
    put:
      tags:
      - "User"
      summary: "Update user details by user ID"
      operationId: "users_userid_put"
      consumes:
      - "application/json"
      parameters:
      - name: "userid"
        in: "path"
        description: "username of user to get details for"
        required: true
        type: "integer"
      - name: "username"
        in: "query"
        description: "User object that needs to be updated"
        required: false
        type: "string"
      - name: "password"
        in: "query"
        description: "User object that needs to be updated"
        required: false
        type: "string"
      - name: "about"
        in: "query"
        description: "User object that needs to be updated"
        required: false
        type: "string"
      - name: "emailid"
        in: "query"
        description: "User object that needs to be updated"
        required: false
        type: "string"
      - name: "imageurl"
        in: "query"
        description: "User object that needs to be updated"
        required: false
        type: "string"
      responses:
        "200":
          description: "User updated successfully"
          schema:
            $ref: "#/definitions/User"
      x-swagger-router-controller: "swagger_server.controllers.user_controller"
  /questions:
