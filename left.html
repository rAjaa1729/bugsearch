<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Textarea Example</title>
    <script>
        function validateTextarea() {
            var message = document.getElementById("message");
            var length = message.value.length;
            var remaining = 100 - length;
            var messageBox = document.getElementById("message-box");
            if (length < 100) {
                messageBox.innerHTML = remaining + " characters remaining";
                messageBox.style.color = "red";
            } else {
                messageBox.innerHTML = "Message is valid";
                messageBox.style.color = "green";
            }
        }
    </script>
</head>
<body>
    <form>
        <label for="message">Enter your message (at least 100 characters):</label><br>
        <textarea id="message" name="message" rows="4" cols="50" minlength="100" onkeyup="validateTextarea()"></textarea><br>
        <div id="message-box"></div>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
